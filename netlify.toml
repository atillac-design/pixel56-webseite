# Netlify-Konfiguration — überstimmt die Einstellungen in der Netlify-UI.
# Die Next.js-App liegt im Unterordner web/; das Next.js-Runtime-Plugin
# übernimmt Serverfunktionen (API-Route, Revalidierung) automatisch.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
