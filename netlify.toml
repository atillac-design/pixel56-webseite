# Netlify-Konfiguration — überstimmt die Einstellungen in der Netlify-UI.
# Die Next.js-App liegt im Unterordner web/; das Next.js-Runtime-Plugin
# übernimmt Serverfunktionen (API-Route, Revalidierung) automatisch.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Next.js 16 braucht Node 20.9 oder neuer; 22 ist die aktuelle LTS.
[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Kunden-Entwürfe unter /vorschau/ niemals indexieren, auch wenn die Seite
# später mit NEXT_PUBLIC_INDEXABLE=true live geht.
[[headers]]
  for = "/vorschau/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
