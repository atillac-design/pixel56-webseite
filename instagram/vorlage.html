<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Pixel56 Woche 1</title>
<style>
@font-face{font-family:Brico;font-weight:800;src:url(node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2)}
@font-face{font-family:Brico;font-weight:700;src:url(node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-700-normal.woff2)}
@font-face{font-family:DM;font-weight:400;src:url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:DM;font-weight:400;font-style:italic;src:url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-italic.woff2)}
@font-face{font-family:DM;font-weight:500;src:url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:DM;font-weight:700;src:url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2)}
:root{--red:#ff4242;--ink:#1e0a12;--plum:#55283a;--card:#fbf6ef;--soft:#efe5d9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#d4b896}
.slide{position:absolute;inset:0;overflow:hidden;font-family:DM;color:var(--ink);--tx:var(--ink);--mut:var(--plum);--cd:#fbf6ef;--cdt:var(--ink);--ln:rgba(30,10,18,.14);
  background:radial-gradient(900px 700px at 100% 0%,#e2cdb4 0%,rgba(226,205,180,0) 70%),radial-gradient(800px 600px at 0% 100%,#c7a989 0%,rgba(199,169,137,0) 70%),#d4b591}
.slide.dark{color:#fbf6ef;--tx:#fbf6ef;--mut:#d7bfae;--cd:#2c1520;--cdt:#fbf6ef;--ln:rgba(251,246,239,.14);
  background:radial-gradient(900px 700px at 100% 0%,#3d1c2a 0%,rgba(61,28,42,0) 70%),radial-gradient(700px 600px at 0% 100%,#140509 0%,rgba(20,5,9,0) 70%),#1e0a12}
.abs{position:absolute}
.kick{position:absolute;left:84px;top:88px;display:flex;align-items:center;gap:16px;font:500 25px DM;letter-spacing:.3em;white-space:nowrap}
.kick .ln{height:3px;background:var(--red);width:34px}
.count{position:absolute;right:84px;top:84px;font:500 25px DM;letter-spacing:.06em;color:var(--mut)}
.foot{position:absolute;left:84px;top:1225px;font:700 33px DM;display:flex;gap:18px;align-items:center}
.swipe{position:absolute;right:84px;top:1233px;font:400 26px DM;color:var(--mut);display:flex;gap:12px;align-items:center}
.prog{position:absolute;left:0;bottom:0;height:5px;background:var(--red);width:0}
.mask{overflow:hidden;display:block;padding-bottom:.1em;margin-bottom:-.1em}
.mask>span{display:block}
.red{color:var(--red)}
.H{position:absolute;left:84px;font:800 108px/0.98 Brico;letter-spacing:-.035em;width:930px}
.h{position:absolute;left:84px;top:170px;font:800 72px/1.02 Brico;letter-spacing:-.035em;width:920px}
.sub{position:absolute;left:84px;font:400 32px/1.45 DM;color:var(--mut);width:912px}
.card{position:absolute;background:var(--cd);color:var(--cdt);border-radius:26px;box-shadow:0 24px 60px -24px rgba(40,15,10,.45);overflow:hidden}
.dark .card{box-shadow:0 0 0 1.5px rgba(251,246,239,.06),0 24px 60px -24px rgba(0,0,0,.6)}
.chip{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:20px;font:700 19px DM;letter-spacing:.12em;white-space:nowrap}
.items{position:absolute;left:84px;width:912px}
.it{display:flex;gap:28px;padding:30px 34px;border-radius:24px;background:var(--cd);color:var(--cdt);margin-bottom:20px}
.dark .it{box-shadow:0 0 0 1.5px rgba(251,246,239,.06)}
.it .n{font:800 40px Brico;color:var(--red);min-width:62px;letter-spacing:-.03em}
.it .t{font:800 36px/1.12 Brico;letter-spacing:-.02em}
.it .s{font:400 27px/1.42 DM;margin-top:8px;opacity:.86}
.src{position:absolute;left:84px;font:400 22px/1.4 DM;color:var(--mut);width:912px}
.prompt{position:absolute;left:84px;width:912px;border-radius:26px;background:#140509;color:#fbf6ef;padding:34px 38px;border:1.5px solid rgba(255,66,66,.45)}
.prompt .lb{font:700 20px DM;letter-spacing:.16em;color:var(--red);margin-bottom:16px;display:flex;justify-content:space-between}
.prompt .tx{font:400 27px/1.5 DM;white-space:pre-wrap}
.prompt .tx i{font-style:normal;color:#ff8a7a}
.tip{position:absolute;left:84px;width:912px;padding:28px 34px;border-radius:24px;background:var(--red);color:#fff}
.tip .lb{font:700 19px DM;letter-spacing:.16em;margin-bottom:8px;opacity:.85}
.tip .tx{font:500 28px/1.4 DM}
.photo{position:absolute;left:616px;top:88px;width:380px;height:380px}
.photo img{position:absolute;left:-10px;top:-10px;width:400px;height:400px;clip-path:circle(45% at 50% 50%)}
.photo svg{position:absolute;inset:0}
.btn{position:absolute;left:84px;top:1059px;height:91px;padding:0 40px;border-radius:46px;background:var(--red);color:#fff;font:700 33px Brico;display:flex;align-items:center;gap:22px;overflow:hidden;transform-origin:left center}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45);opacity:0}
.finger{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(30,10,18,.18);border:3px solid rgba(255,255,255,.9);opacity:0;box-shadow:0 10px 30px rgba(30,10,18,.3);z-index:20}
.stars{display:flex;gap:4px}
.ph{height:14px;border-radius:7px;background:#e6dacb}
.img{position:absolute;overflow:hidden;border-radius:22px;box-shadow:0 24px 60px -22px rgba(40,15,10,.5)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.qt{font:italic 400 36px/1.45 DM}
</style></head><body>
<script>
const ARR='<span class="arr" style="display:inline-block"><svg width="0.85em" height="0.85em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>';
const STARP='M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z';
const stars=(n,sz=30,c='#ff4242')=>`<div class="stars">${Array(5).fill(0).map((_,i)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path class="sp" d="${STARP}" fill="${i<n?c:'#d9c7b3'}"/></svg>`).join('')}</div>`;
const CHECK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const H=(lines,red,top,cls='h',style='')=>`<div class="${cls}" data-m=".35" style="top:${top}px;${style}">${lines.map((l,i)=>`<span class="mask"><span class="${i>=red?'red':''}">${l}</span></span>`).join('')}</div>`;
const items=(arr,top,start=1)=>`<div class="items" style="top:${top}px">${arr.map((x,i)=>`<div class="it" data-up="${.6+i*.15}"><div class="n">${String(start+i).padStart(2,'0')}</div><div><div class="t">${x[0]}</div><div class="s">${x[1]}</div></div></div>`).join('')}</div>`;
const CTA=(o)=>`<div class="photo"><img src="img/team-atilla.webp"><svg viewBox="0 0 380 380"><circle cx="190" cy="190" r="185" fill="none" stroke="#ff4242" stroke-width="8" stroke-linecap="round" transform="rotate(-90 190 190)"/></svg></div>
  ${H(o.h,o.red??99,555,'H','font-size:92px;line-height:1.0')}
  <div class="sub" data-up="1.4" style="top:${o.subTop||790}px;font-size:33px">${o.sub}</div>
  <div class="abs" data-up="1.8" style="left:84px;top:935px;font:700 35px DM">Atilla Ciftcioglu</div>
  <div class="abs" data-up="1.9" style="left:84px;top:985px;font:400 28px DM;color:var(--mut)">Gründer Pixel56 · Websites, Ads, Content, KI</div>
  <div class="btn"><span>${o.btn||'Schreib Atilla · DM oder pixel56.de'}</span>${ARR}<div class="ripple"></div></div>`;

/* ======================= POSTS ======================= */
const MK=(pos)=>pos.map((m,i)=>`<div class="mk3" style="position:absolute;left:${m[0]*100}%;top:${m[1]*100}%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ff4242;color:#fff;font:800 26px Brico;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.35)">${m[2]||i+1}</div>`).join('');
const ABBPOS=[[.73,.58],[.62,.24],[.52,.09],[.73,.935],[.2,.86]];
const REV=(o)=>`
  <div class="img" style="left:84px;top:170px;width:912px;height:470px;background:${o.m?'#fff':'#1e0a12'}">${o.m?`<img src="img/${o.m}" style="object-position:${o.pos||'50% 50%'};object-fit:${o.fit||'cover'}">`:`<div style="padding:60px;color:#fbf6ef"><div style="font:800 190px/0.8 Brico;color:var(--red);height:110px">„</div><div style="margin-top:40px">${stars(5,74)}</div><div style="font:800 54px Brico;margin-top:34px">5 von 5 Sternen</div><div style="font:400 28px DM;opacity:.75;margin-top:8px">${o.s.replace('Google, ','Google-Bewertung · ')}</div></div>`}</div>
  <div class="chip abs" style="left:110px;top:196px;background:#1e0a12;color:#fff;${o.m?'':'left:auto;right:110px;background:#fbf6ef;color:#1e0a12'}">${o.c}</div>
  <div class="abs" style="left:84px;top:680px;display:flex;align-items:center;gap:24px">
   <div style="width:110px;height:110px;border-radius:50%;overflow:hidden;border:4px solid var(--red);background:#fff">${o.p?`<img src="img/${o.p}" style="width:100%;height:100%;object-fit:${o.pfit||'cover'}">`:`<div style="width:100%;height:100%;background:${o.col};color:#fff;font:800 40px Brico;display:flex;align-items:center;justify-content:center">${o.ini}</div>`}</div>
   <div><div style="font:800 36px Brico">${o.n}</div><div style="font:400 25px DM;color:var(--mut);margin-top:2px">${o.r} · ${o.s}</div><div style="margin-top:8px">${stars(5,26)}</div></div></div>
  <div class="qt abs" style="left:84px;top:840px;width:912px;font-size:${o.q.length>100?40:o.q.length>40?46:58}px">„${o.q}“</div>`;
const RECAP=(rows,next)=>`${H(['Diese Woche','zum Nachlesen.'],1,170)}
  <div class="abs" style="left:84px;top:380px;width:912px">${rows.map(x=>`<div style="display:flex;align-items:center;gap:26px;padding:20px 0;border-bottom:1.5px solid var(--ln)"><div style="font:800 30px Brico;color:var(--red);width:60px">${x[0]}</div><div style="font:500 30px DM">${x[1]}</div></div>`).join('')}</div>
  <div class="tip" data-up="1.0" style="top:1010px"><div class="lb">NÄCHSTE WOCHE</div><div class="tx">${next}</div></div>`;

const MK2=(pos)=>pos.map((m,i)=>`<div class="mk3" style="position:absolute;left:${m[0]*100}%;top:${m[1]*100}%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ff4242;color:#fff;font:800 26px Brico;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5">${m[2]||i+1}</div>`).join('');
const ADPOS=[[-.02,.3],[.96,.24],[.78,.08],[-.02,.86],[.97,.95]];
const AD=(sz,marks)=>`<div style="position:relative;width:${sz}px;height:${sz}px"><div style="position:absolute;left:0;top:0;width:500px;height:500px;transform:scale(${sz/500});transform-origin:0 0;border-radius:22px;overflow:hidden;background:#f3efe9;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);font-family:DM">
  <div style="position:absolute;left:22px;top:22px;display:flex;gap:8px"><div style="background:#fff;border-radius:8px;padding:6px 10px;font:700 15px DM;color:#1f9d55">✓ UNBEFRISTET</div><div style="background:#fff;border-radius:8px;padding:6px 10px;font:700 15px DM;color:#c0392b">● IN DEINER REGION</div></div>
  <div style="position:absolute;right:0;top:110px;width:200px;height:290px;background:linear-gradient(160deg,#cfd8dc,#9fb0b9);display:flex;flex-direction:column;align-items:center;justify-content:center">
   <svg width="120" height="150" viewBox="0 0 24 30" fill="rgba(255,255,255,.75)"><circle cx="12" cy="8" r="6"/><path d="M0 30a12 12 0 0 1 24 0z"/></svg>
   <div style="font:700 13px DM;letter-spacing:.1em;color:#fff;margin-top:8px;text-align:center">ECHTES FOTO<br>AUS DEM TEAM</div></div>
  <div style="position:absolute;left:24px;top:110px;width:270px;font:800 44px/1.02 Brico;color:#12305a;letter-spacing:-.02em">Du baust Bäder, die man zeigen will?</div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:#12305a;padding:18px 24px;color:#fff">
   <div style="font:500 16px DM;opacity:.8">Wir suchen dich als</div>
   <div style="font:800 26px Brico;margin-top:2px">Anlagenmechaniker SHK (m/w/d)</div>
   <div style="position:absolute;right:20px;bottom:16px;background:#ffd23f;color:#12305a;border-radius:10px;padding:8px 14px;font:800 16px DM">In 60 Sek. bewerben →</div></div>
 </div>${marks?MK2(marks):''}</div>`;
const REV2=(o)=>`
  <div class="img" style="left:84px;top:170px;width:912px;height:470px;background:${o.m?'#fff':'#1e0a12'}">${o.m?`<img src="img/${o.m}" style="object-position:${o.pos||'50% 50%'}">`:`<div style="padding:60px;color:#fbf6ef"><div style="font:800 190px/0.8 Brico;color:var(--red);height:110px">„</div><div style="margin-top:40px">${stars(5,74)}</div><div style="font:800 54px Brico;margin-top:34px">5 von 5 Sternen</div><div style="font:400 28px DM;opacity:.75;margin-top:8px">${o.s.replace('Google, ','Google-Bewertung · ')}</div></div>`}</div>
  <div class="chip abs" style="left:110px;top:196px;background:#1e0a12;color:#fff;${o.m?'':'left:auto;right:110px;background:#fbf6ef;color:#1e0a12'}">${o.c}</div>
  <div class="abs" style="left:84px;top:680px;display:flex;align-items:center;gap:24px">
   <div style="width:110px;height:110px;border-radius:50%;overflow:hidden;border:4px solid var(--red);background:${o.col};color:#fff;font:800 40px Brico;display:flex;align-items:center;justify-content:center">${o.ini}</div>
   <div><div style="font:800 36px Brico">${o.n}</div><div style="font:400 25px DM;color:var(--mut);margin-top:2px">${o.r} · ${o.s}</div><div style="margin-top:8px">${stars(5,26)}</div></div></div>
  <div class="qt abs" style="left:84px;top:840px;width:912px;font-size:${o.q.length>100?40:o.q.length>40?46:58}px">„${o.q}“</div>`;
const STAT=(rows)=>`<div class="abs" style="left:84px;top:390px;width:912px">${rows.map(r=>`<div style="display:flex;gap:30px;padding:26px 0;border-top:1.5px solid var(--ln)"><div style="font:800 58px Brico;color:var(--red);letter-spacing:-.04em;min-width:280px">${r[0]}</div><div><div style="font:400 27px/1.4 DM">${r[1]}</div><div style="font:400 21px DM;opacity:.65;margin-top:8px">${r[2]}</div></div></div>`).join('')}</div>`;

/* ---------- helpers for week 16.-22.11. ---------- */
const COL=(kids,gap=28)=>`<div class="abs" style="left:84px;top:168px;width:912px;height:1030px;display:flex;flex-direction:column;justify-content:space-between;gap:${gap}px">${kids.join('')}</div>`;
const HD=(lines,red=99,size=74)=>`<div style="font:800 ${size}px/1.03 Brico;letter-spacing:-.035em">${lines.map((l,i)=>`<div class="${i>=red?'red':''}">${l}</div>`).join('')}</div>`;
const TX=(t,size=36)=>`<div style="font:400 ${size}px/1.4 DM;color:var(--mut)">${t}</div>`;
const DOT=(n,x,y)=>`<div style="position:absolute;left:${x}%;top:${y}%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ff4242;color:#fff;font:800 28px Brico;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:5">${n}</div>`;
const PIC=(src,h,o={})=>`<div style="position:relative;height:${h}px;flex:none;border-radius:22px;overflow:hidden;background:${o.bg||'#fff'};box-shadow:0 24px 60px -24px rgba(40,15,10,.5)"><img src="img/${src}" style="width:100%;height:100%;display:block;object-fit:${o.fit||'cover'};object-position:${o.pos||'50% 50%'}">${o.chip?`<div class="chip" style="position:absolute;left:22px;top:22px;background:#1e0a12;color:#fff">${o.chip}</div>`:''}${(o.dots||[]).map(d=>DOT(d[0],d[1],d[2])).join('')}</div>`;
const CARD=(inner,o={})=>`<div style="background:${o.bg||'var(--cd)'};color:${o.col||'var(--cdt)'};border-radius:22px;padding:${o.pad||'28px 34px'};flex:none;${o.border?'border:2px solid var(--red);':''}${o.style||''}">${inner}</div>`;
const LBL=(t,c='var(--red)')=>`<div style="font:700 19px DM;letter-spacing:.16em;color:${c}">${t}</div>`;
const WIR=(t,l='SO BAUEN WIR DAS EIN')=>`<div style="background:var(--red);color:#fff;border-radius:22px;padding:24px 30px;flex:none"><div style="font:700 18px DM;letter-spacing:.16em;opacity:.85">${l}</div><div style="font:500 34px/1.38 DM;margin-top:8px">${t}</div></div>`;
const AR=`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.7"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;
const FLOW=(steps,end)=>`<div style="display:flex;align-items:center;gap:10px;flex:none">${steps.map((s,i)=>`${i?AR:''}<div style="flex:1;min-height:160px;border-radius:20px;padding:16px 14px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 30px/1.2 DM;background:${i===steps.length-1?(end==='bad'?'#ff4242':'#1f9d55'):'var(--cd)'};color:${i===steps.length-1?'#fff':'var(--cdt)'}">${s}</div>`).join('')}</div>`;
const LIST=(arr,icon)=>`<div style="display:flex;flex-direction:column;gap:18px;flex:none">${arr.map(x=>`<div style="display:flex;gap:18px;align-items:flex-start"><div style="width:44px;height:44px;border-radius:50%;background:${icon==='x'?'#ff4242':'#1f9d55'};display:flex;align-items:center;justify-content:center;flex:none">${icon==='x'?CROSS:CHECK}</div><div style="font:400 35px/1.35 DM;padding-top:0">${x}</div></div>`).join('')}</div>`;
const NUM=(n,label)=>`<div style="display:flex;align-items:center;gap:16px;flex:none"><div style="font:800 34px Brico;color:var(--red)">${n}</div>${label?`<div class="chip" style="background:var(--red);color:#fff">${label}</div>`:''}</div>`;
const RVW=(name,role,quote,img)=>CARD(`<div style="display:flex;align-items:center;gap:18px">${img?`<div style="width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none"><img src="img/${img}" style="width:100%;height:100%;object-fit:cover"></div>`:''}<div><div style="font:700 31px DM">${name}</div><div style="font:400 23px DM;opacity:.7">${role}</div></div><div style="margin-left:auto">${stars(5,28)}</div></div><div style="font:italic 400 37px/1.4 DM;margin-top:18px">„${quote}“</div>`,{bg:'#fbf6ef',col:'#1e0a12'});
const BTN=(t)=>`<div style="height:76px;padding:0 34px;border-radius:38px;background:var(--red);color:#fff;font:700 28px DM;display:inline-flex;align-items:center;gap:14px;flex:none;align-self:flex-start">${t} ${ARR}</div>`;
const SPACER=`<div style="flex:1"></div>`;
const TABLE=(rows)=>`<div style="flex:none">${rows.map((x,i)=>`<div style="display:flex;align-items:center;gap:22px;padding:21px 0;border-top:1.5px solid var(--ln)"><div style="font:800 34px Brico;color:var(--red);width:46px">${i+1}</div><div style="flex:1;font:500 32px/1.3 DM">${x[0]}</div><div class="chip" style="background:var(--red);color:#fff;height:46px;font-size:19px;letter-spacing:.06em">${x[1].toUpperCase()}</div></div>`).join('')}<div style="border-top:1.5px solid var(--ln)"></div></div>`;
const WIRE=(dots)=>`<div style="position:relative;background:#fbf6ef;border-radius:22px;padding:30px 36px;flex:none">
   <div style="position:relative;height:44px;width:70%;border-radius:10px;background:#1e0a12">${dots?DOT(1,104,50):''}</div>
   <div style="height:16px;width:55%;border-radius:8px;background:#d9c7b3;margin-top:16px"></div>
